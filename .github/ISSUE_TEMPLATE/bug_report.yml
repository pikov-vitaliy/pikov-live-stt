# Modified in 2026 by Vitaly Pikov for Pikov LiveSTT; based on WhisperLiveKit.
name: Bug report
description: Report a reproducible problem in Pikov LiveSTT
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: before-submitting
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: I reproduced the problem with the current Pikov LiveSTT main branch.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest command, configuration, code sample, or audio fixture that reproduces the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Pikov LiveSTT commit, browser/extension, Docker/OS/GPU, WhisperLiveKit backend, policy, model, and relevant flags.
      placeholder: |
        Pikov LiveSTT commit: abcdef0
        Browser and version: Chrome 000
        Extension version: 1.0
        Docker Desktop: 0.0.0
        OS: Windows 11
        GPU: NVIDIA GPU / driver version
        WhisperLiveKit backend: faster-whisper
        Policy: localagreement
        Model: large-v3
        Relevant flags: --language ru
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant traceback or logs. Remove secrets, personal data, meeting content, and local paths first.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add sanitized screenshots, profiling results, or a synthetic/public-domain audio fixture. Do not attach real meeting audio or transcripts.
