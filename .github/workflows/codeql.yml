# Modified in 2026 by Vitaly Pikov for Pikov LiveSTT; based on WhisperLiveKit.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # Required by CodeQL to inspect workflow runs.
      contents: read
      packages: read # Required by CodeQL to fetch language packs.
      security-events: write # Required to upload the code-scanning result.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: python,javascript-typescript

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
